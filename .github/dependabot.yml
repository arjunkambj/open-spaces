# Keeps the GitHub Actions and the JavaScript tooling (Turbo) up to date.
# The one Swift dependency is Sparkle, in the Mac app.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking a new release, so a bad one can be pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: weekly
    commit-message:
      prefix: build
