# Keeps the GitHub Actions and the JavaScript packages up to date: Turbo at the root, and
# what the website in apps/web is built with. The one Swift dependency is Sparkle, in the Mac app.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The root holds the pnpm workspace and its one lock file, so this entry covers every
  # package.json in it, apps/web included.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # These two are released together and must have the same version.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    # Wait a week before taking a new release, so a bad one can be pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: weekly
    commit-message:
      prefix: build
