# The Xcode project for the iPhone app. Made by XcodeGen: run `pnpm ios:generate`
# (or `xcodegen generate` in this folder). The .xcodeproj is not kept in git.
#
# Almost all of the code is in the Swift package in ./Phone, which also builds on a Mac.
# The targets here are thin shells: the app's entry point and its App Intents, the
# keyboard extension's principal class, and the widget extension's bundle.
name: Spaces

options:
  bundleIdPrefix: dev.openspaces
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # The app icon lives once, in /assets. Copy it into the asset catalog before generating.
  preGenCommand: cp ../../assets/icon-ios-1024.png App/Assets.xcassets/AppIcon.appiconset/icon-ios-1024.png

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is yours to set up: pick your team in Xcode.
    # See README.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GCC_TREAT_WARNINGS_AS_ERRORS: false
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false

packages:
  phone:
    path: Phone
  domain:
    path: ../../packages/domain
  store:
    path: ../../packages/store
  ai:
    path: ../../packages/ai
  audio:
    path: ../../packages/audio
  engine:
    path: ../../packages/engine
  ui:
    path: ../../packages/ui

targets:
  Spaces:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: phone
        product: SpacesPhone
      - package: phone
        product: SpacesLive
      - target: SpacesKeyboard
        embed: true
      - target: SpacesWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspaces.ios
        PRODUCT_NAME: Spaces
        CODE_SIGN_ENTITLEMENTS: App/Spaces.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Spaces-Info.plist
      properties:
        CFBundleDisplayName: Spaces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Spaces listens while you dictate or record a meeting, and turns what it hears into text.
        # Meetings keep recording with the screen locked or the app in the background.
        UIBackgroundModes:
          - audio
        # A recording shows on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.openspaces.ios
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - openspaces
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchGlyph
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SpacesKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "*.entitlements"
    dependencies:
      - package: phone
        product: SpacesKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspaces.ios.keyboard
        PRODUCT_NAME: SpacesKeyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/SpacesKeyboard.entitlements
        SKIP_INSTALL: true
    info:
      path: Generated/SpacesKeyboard-Info.plist
      properties:
        CFBundleDisplayName: Spaces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Full Access: lets the keyboard open the app and read the shared library.
            RequestsOpenAccess: true

  # Holds the Live Activity for a meeting that is being recorded.
  SpacesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: phone
        product: SpacesLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspaces.ios.widgets
        PRODUCT_NAME: SpacesWidgets
        SKIP_INSTALL: true
    info:
      path: Generated/SpacesWidgets-Info.plist
      properties:
        CFBundleDisplayName: Spaces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
