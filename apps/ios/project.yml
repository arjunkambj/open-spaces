# The Xcode project for the iPhone app. Made by XcodeGen: run `pnpm ios:generate`
# (or `xcodegen generate` in this folder). The .xcodeproj is not kept in git.
#
# Almost all of the code is in the Swift package in ./Phone, which also builds on a Mac.
# The targets here are thin shells: the app's entry point and its App Intents, the
# keyboard extension's principal class, and the widget extension's bundle.
name: OpenWisper

options:
  bundleIdPrefix: dev.openwisper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # The app icon lives once, in /assets. Copy it into the asset catalog before generating.
  preGenCommand: cp ../../assets/icon-ios-1024.png App/Assets.xcassets/AppIcon.appiconset/icon-ios-1024.png

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is yours to set up: pick your team in Xcode.
    # See README.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GCC_TREAT_WARNINGS_AS_ERRORS: false
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false

packages:
  phone:
    path: Phone
  domain:
    path: ../../packages/domain
  store:
    path: ../../packages/store
  ai:
    path: ../../packages/ai
  audio:
    path: ../../packages/audio
  engine:
    path: ../../packages/engine
  ui:
    path: ../../packages/ui

targets:
  OpenWisper:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: phone
        product: WisperPhone
      - package: phone
        product: WisperLive
      - target: OpenWisperKeyboard
        embed: true
      - target: OpenWisperWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwisper.ios
        PRODUCT_NAME: OpenWisper
        CODE_SIGN_ENTITLEMENTS: App/OpenWisper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/OpenWisper-Info.plist
      properties:
        CFBundleDisplayName: Open Wisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Open Wisper listens while you dictate or record a meeting, and turns what it hears into text.
        # Meetings keep recording with the screen locked or the app in the background.
        UIBackgroundModes:
          - audio
        # A recording shows on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.openwisper.ios
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - openwisper
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchGlyph
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - OpenWisperTests
        # The package's own tests, run once more on an iPhone simulator.
        - package: phone/WisperPhoneTests
      gatherCoverageData: false

  OpenWisperKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "*.entitlements"
    dependencies:
      - package: phone
        product: WisperKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwisper.ios.keyboard
        PRODUCT_NAME: OpenWisperKeyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/OpenWisperKeyboard.entitlements
        SKIP_INSTALL: true
    info:
      path: Generated/OpenWisperKeyboard-Info.plist
      properties:
        CFBundleDisplayName: Open Wisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Full Access: lets the keyboard open the app and read the shared library.
            RequestsOpenAccess: true

  # Holds the Live Activity for a meeting that is being recorded.
  OpenWisperWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: phone
        product: WisperLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwisper.ios.widgets
        PRODUCT_NAME: OpenWisperWidgets
        SKIP_INSTALL: true
    info:
      path: Generated/OpenWisperWidgets-Info.plist
      properties:
        CFBundleDisplayName: Open Wisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Checks the built app itself: its Info.plist, its icon, its link scheme.
  OpenWisperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenWisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwisper.ios.tests
        GENERATE_INFOPLIST_FILE: true
